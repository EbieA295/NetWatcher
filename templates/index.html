<!DOCTYPE html>
<html>
<head>
    <title>NetWatcher Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">
    <h1 class="text-3xl font-bold text-emerald-400 mb-5">Net-Watcher Dashboard</h1>
    <div class="bg-gray-800 p-5 rounded-lg">
        <table class="w-full">
            <thead>
                <tr class="border-b border-gray-700 text-emerald-400">
                    <th class="text-left py-3">IP Address</th>
                    <th class="text-left py-3">MAC Address</th>
                    <th class="text-left py-3">Vendor / Merk</th> </tr>
            </thead>
            <tbody>
                {% for d in devices %}
                <tr class="border-b border-gray-700 hover:bg-gray-750 transition-colors">
                    <td class="py-3 font-mono">{{ d.ip }}</td>
                    <td class="py-3 font-mono text-sm text-gray-400">{{ d.mac }}</td>
                    <td class="py-3 text-sm text-emerald-100 italic">{{ d.vendor }}</td> </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
